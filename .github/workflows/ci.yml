name: Secure API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare report directory
        if: always()
        run: mkdir -p evidence
      - name: SAST with Bandit
        run: bandit -r app.py -f json -o evidence/bandit-report.json
      - name: SCA with pip-audit
        run: pip-audit -r requirements.txt --format json --output evidence/pip-audit-report.json
      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            evidence/bandit-report.json
            evidence/pip-audit-report.json
          if-no-files-found: warn
      - name: Run API tests
        env:
          JWT_SECRET: test-secret-only-for-ci-at-least-32-bytes-long
        run: python -m pytest -q
