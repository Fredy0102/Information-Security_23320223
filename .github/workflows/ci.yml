name: Secure API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare report directory
        if: always()
        run: mkdir -p evidence
      - name: SAST with Bandit
        run: bandit -r app.py -f json -o evidence/bandit-report.json
      - name: SCA with pip-audit
        run: pip-audit -r requirements.txt --format json --output evidence/pip-audit-report.json
      - name: SCA with OWASP Dependency-Check
        run: |
          mkdir -p evidence/dependency-check
          docker pull owasp/dependency-check:13.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            owasp/dependency-check:13.0.0 \
            --scan /src/requirements.txt \
            --enableExperimental \
            --format HTML \
            --out /src/evidence/dependency-check
      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            evidence/bandit-report.json
            evidence/pip-audit-report.json
            evidence/dependency-check/dependency-check-report.html
          if-no-files-found: warn
      - name: Run API tests
        env:
          JWT_SECRET: test-secret-only-for-ci-at-least-32-bytes-long
        run: python -m pytest -q
